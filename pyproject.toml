[project]
name = "safeinterp"
version = "0.1.0"
description = "Sparse autoencoders for locating zero-shot task knowledge in GPT-2"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "transformers>=4.40", "datasets>=2.18", "numpy"]

[project.optional-dependencies]
plot = ["matplotlib"]
dev = ["pytest"]

[project.scripts]
safeinterp = "safeinterp.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["safeinterp"]
